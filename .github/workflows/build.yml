name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/$(ls $ANDROID_HOME/cmdline-tools | head -1)/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Generate project files
        run: |
          mkdir -p appguard_project
          cd appguard_project
          true
          cat > settings.gradle.kts <<'APPGUARD_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AppGuard"
          include(":app")
          APPGUARD_EOF
          true
          cat > build.gradle.kts <<'APPGUARD_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          APPGUARD_EOF
          true
          cat > gradle.properties <<'APPGUARD_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          APPGUARD_EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'APPGUARD_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.appguard"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.appguard"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          APPGUARD_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'APPGUARD_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- 讓 App 能列出手機中可開啟的軟體 -->
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".GuardService"
                      android:exported="false"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          APPGUARD_EOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/accessibility_config.xml <<'APPGUARD_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="false"
              android:description="@string/service_description"
              android:notificationTimeout="100" />
          APPGUARD_EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'APPGUARD_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">用量守門員</string>
              <string name="service_description">偵測您所設定的軟體何時被開啟，並在適當時機顯示詢問視窗。本服務不會讀取螢幕內容。</string>
          </resources>
          APPGUARD_EOF
          mkdir -p app/src/main/java/com/example/appguard
          cat > app/src/main/java/com/example/appguard/Prefs.kt <<'APPGUARD_EOF'
          package com.example.appguard

          import android.content.Context

          /** 每個軟體的限制設定，存在 SharedPreferences。 */
          object Prefs {
              const val MODE_NONE = 0   // 不限制
              const val MODE_TIMER = 1  // 開啟後 N 分鐘詢問是否繼續
              const val MODE_ASK = 2    // 一開啟就詢問是否有必要使用

              private const val FILE = "guard_prefs"
              private const val DEFAULT_MINUTES = 15

              private fun sp(c: Context) = c.getSharedPreferences(FILE, Context.MODE_PRIVATE)

              fun getMode(c: Context, pkg: String): Int = sp(c).getInt("mode_$pkg", MODE_NONE)

              fun getMinutes(c: Context, pkg: String): Int = sp(c).getInt("min_$pkg", DEFAULT_MINUTES)

              fun set(c: Context, pkg: String, mode: Int, minutes: Int) {
                  sp(c).edit().putInt("mode_$pkg", mode).putInt("min_$pkg", minutes).apply()
              }

              fun defaultMinutes() = DEFAULT_MINUTES
          }
          APPGUARD_EOF
          mkdir -p app/src/main/java/com/example/appguard
          cat > app/src/main/java/com/example/appguard/GuardService.kt <<'APPGUARD_EOF'
          package com.example.appguard

          import android.accessibilityservice.AccessibilityService
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView

          /**
           * 無障礙服務：偵測前景軟體，並依設定顯示詢問視窗。
           *
           * 一個「使用階段」＝從被監控軟體進到前景，到切換到其他軟體 / 回桌面 / 螢幕關閉為止。
           * 階段結束時，計時與視窗一律重置，下次再開啟就重新開始。
           */
          class GuardService : AccessibilityService() {

              private val handler = Handler(Looper.getMainLooper())
              private lateinit var wm: WindowManager

              private var currentPkg: String? = null   // 目前正在被監控的軟體（無則為 null）
              private var overlay: FrameLayout? = null
              private var timerTask: Runnable? = null

              private val screenOffReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) = endSession()
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  registerReceiver(screenOffReceiver, IntentFilter(Intent.ACTION_SCREEN_OFF))
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event?.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
                  val pkg = event.packageName?.toString() ?: return

                  // 忽略自己（詢問視窗）、系統介面與輸入法，避免誤判成「離開軟體」
                  if (pkg == packageName || pkg == "com.android.systemui" || isInputMethod(pkg)) return

                  if (pkg == currentPkg) return  // 仍在同一個軟體內，不重複處理

                  // 切換到不同的軟體：結束上一個階段
                  endSession()

                  val mode = Prefs.getMode(this, pkg)
                  if (mode == Prefs.MODE_NONE) return

                  currentPkg = pkg
                  when (mode) {
                      Prefs.MODE_TIMER -> scheduleTimer(pkg)
                      Prefs.MODE_ASK -> showDialog(
                          pkg,
                          message = "你有必要使用「${labelOf(pkg)}」嗎？",
                          continueText = "有必要，繼續使用",
                          closeText = "沒必要，關閉"
                      ) { /* 選擇繼續後不再詢問，直到此階段結束 */ }
                  }
              }

              // ---------- 第一項：計時詢問 ----------

              private fun scheduleTimer(pkg: String) {
                  val minutes = Prefs.getMinutes(this, pkg).coerceAtLeast(1)
                  val task = Runnable {
                      if (currentPkg != pkg) return@Runnable
                      showDialog(
                          pkg,
                          message = "你已經使用「${labelOf(pkg)}」$minutes 分鐘了，要繼續使用嗎？",
                          continueText = "繼續使用",
                          closeText = "關閉軟體"
                      ) {
                          // 選擇繼續 → 再計時一輪
                          if (currentPkg == pkg) scheduleTimer(pkg)
                      }
                  }
                  timerTask = task
                  handler.postDelayed(task, minutes * 60_000L)
              }

              // ---------- 詢問視窗 ----------

              private fun showDialog(
                  pkg: String,
                  message: String,
                  continueText: String,
                  closeText: String,
                  onContinue: () -> Unit
              ) {
                  removeOverlay()

                  val d = resources.displayMetrics.density
                  fun dp(v: Int) = (v * d).toInt()

                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(24), dp(24), dp(24), dp(16))
                      background = GradientDrawable().apply {
                          setColor(Color.WHITE)
                          cornerRadius = dp(20).toFloat()
                      }
                  }
                  card.addView(TextView(this).apply {
                      text = message
                      textSize = 18f
                      setTextColor(Color.parseColor("#212121"))
                      typeface = Typeface.DEFAULT_BOLD
                      setPadding(0, 0, 0, dp(20))
                  })
                  card.addView(Button(this).apply {
                      text = continueText
                      setOnClickListener {
                          removeOverlay()
                          onContinue()
                      }
                  })
                  card.addView(Button(this).apply {
                      text = closeText
                      setOnClickListener {
                          endSession()
                          performGlobalAction(GLOBAL_ACTION_HOME)  // 回到桌面 = 關閉該軟體
                      }
                  })

                  val root = FrameLayout(this).apply {
                      setBackgroundColor(Color.parseColor("#B3000000"))
                      isClickable = true  // 吃掉點擊，避免點到底下的軟體
                      addView(
                          card,
                          FrameLayout.LayoutParams(
                              FrameLayout.LayoutParams.MATCH_PARENT,
                              FrameLayout.LayoutParams.WRAP_CONTENT,
                              Gravity.CENTER
                          ).apply { setMargins(dp(32), 0, dp(32), 0) }
                      )
                  }

                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  try {
                      wm.addView(root, lp)
                      overlay = root
                  } catch (_: Exception) {
                  }
              }

              private fun removeOverlay() {
                  overlay?.let {
                      try {
                          wm.removeView(it)
                      } catch (_: Exception) {
                      }
                  }
                  overlay = null
              }

              // ---------- 工具 ----------

              private fun endSession() {
                  timerTask?.let { handler.removeCallbacks(it) }
                  timerTask = null
                  removeOverlay()
                  currentPkg = null
              }

              private fun labelOf(pkg: String): String = try {
                  packageManager.getApplicationLabel(packageManager.getApplicationInfo(pkg, 0)).toString()
              } catch (_: PackageManager.NameNotFoundException) {
                  pkg
              }

              private fun isInputMethod(pkg: String): Boolean =
                  try {
                      (getSystemService(INPUT_METHOD_SERVICE) as android.view.inputmethod.InputMethodManager)
                          .enabledInputMethodList.any { it.packageName == pkg }
                  } catch (_: Exception) {
                      false
                  }

              override fun onInterrupt() = endSession()

              override fun onDestroy() {
                  endSession()
                  try {
                      unregisterReceiver(screenOffReceiver)
                  } catch (_: Exception) {
                  }
                  super.onDestroy()
              }
          }
          APPGUARD_EOF
          mkdir -p app/src/main/java/com/example/appguard
          cat > app/src/main/java/com/example/appguard/MainActivity.kt <<'APPGUARD_EOF'
          package com.example.appguard

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.ComponentName
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.drawable.Drawable
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.view.View
          import android.view.ViewGroup
          import android.widget.BaseAdapter
          import android.widget.Button
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ListView
          import android.widget.RadioButton
          import android.widget.RadioGroup
          import android.widget.TextView

          class MainActivity : Activity() {

              private data class AppItem(val pkg: String, val label: String, val icon: Drawable)

              private var apps: List<AppItem> = emptyList()
              private lateinit var statusText: TextView
              private lateinit var statusButton: Button
              private lateinit var adapter: AppAdapter

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.WHITE)
                      setPadding(dp(16), dp(40), dp(16), 0)
                  }

                  root.addView(TextView(this).apply {
                      text = "用量守門員"
                      textSize = 26f
                      setTextColor(Color.parseColor("#212121"))
                  })

                  statusText = TextView(this).apply {
                      textSize = 14f
                      setPadding(0, dp(8), 0, dp(4))
                  }
                  root.addView(statusText)

                  statusButton = Button(this).apply {
                      text = "前往開啟「無障礙」權限"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  }
                  root.addView(statusButton)

                  root.addView(TextView(this).apply {
                      text = "點選下方軟體來設定限制："
                      textSize = 14f
                      setTextColor(Color.GRAY)
                      setPadding(0, dp(12), 0, dp(4))
                  })

                  val list = ListView(this)
                  adapter = AppAdapter()
                  list.adapter = adapter
                  list.setOnItemClickListener { _, _, pos, _ -> showSettingDialog(apps[pos]) }
                  root.addView(
                      list,
                      LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f)
                  )

                  setContentView(root)
                  loadApps()
              }

              override fun onResume() {
                  super.onResume()
                  refreshStatus()
                  adapter.notifyDataSetChanged()
              }

              private fun loadApps() {
                  val pm = packageManager
                  val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  apps = pm.queryIntentActivities(intent, 0)
                      .map { it.activityInfo.packageName to it }
                      .filter { it.first != packageName }
                      .distinctBy { it.first }
                      .map { (pkg, ri) -> AppItem(pkg, ri.loadLabel(pm).toString(), ri.loadIcon(pm)) }
                      .sortedBy { it.label.lowercase() }
                  adapter.notifyDataSetChanged()
              }

              private fun isServiceEnabled(): Boolean {
                  val enabled = Settings.Secure.getString(
                      contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: return false
                  val me = ComponentName(this, GuardService::class.java).flattenToString()
                  return enabled.split(':').any { it.equals(me, ignoreCase = true) }
              }

              private fun refreshStatus() {
                  if (isServiceEnabled()) {
                      statusText.text = "✅ 服務運作中"
                      statusText.setTextColor(Color.parseColor("#2E7D32"))
                      statusButton.visibility = View.GONE
                  } else {
                      statusText.text = "⚠️ 尚未開啟無障礙服務，限制不會生效"
                      statusText.setTextColor(Color.parseColor("#C62828"))
                      statusButton.visibility = View.VISIBLE
                  }
              }

              private fun summary(pkg: String): String = when (Prefs.getMode(this, pkg)) {
                  Prefs.MODE_TIMER -> "每使用 ${Prefs.getMinutes(this, pkg)} 分鐘詢問是否繼續"
                  Prefs.MODE_ASK -> "開啟時詢問是否有必要使用"
                  else -> "未設定限制"
              }

              private fun showSettingDialog(item: AppItem) {
                  val mode = Prefs.getMode(this, item.pkg)
                  val minutes = Prefs.getMinutes(this, item.pkg)

                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(24), dp(12), dp(24), 0)
                  }
                  val group = RadioGroup(this)
                  val rNone = RadioButton(this).apply { text = "不限制"; id = View.generateViewId() }
                  val rTimer = RadioButton(this).apply {
                      text = "第一項：開啟後計時，時間到詢問是否繼續"
                      id = View.generateViewId()
                  }
                  val rAsk = RadioButton(this).apply {
                      text = "第二項：一開啟就詢問是否有必要使用"
                      id = View.generateViewId()
                  }
                  group.addView(rNone)
                  group.addView(rTimer)
                  group.addView(rAsk)
                  box.addView(group)

                  val minutesRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(dp(32), 0, 0, 0)
                  }
                  minutesRow.addView(TextView(this).apply { text = "每次計時（分鐘）：" })
                  val input = EditText(this).apply {
                      inputType = InputType.TYPE_CLASS_NUMBER
                      setText(minutes.toString())
                      minEms = 3
                  }
                  minutesRow.addView(input)
                  box.addView(minutesRow)

                  fun updateRow() {
                      val on = group.checkedRadioButtonId == rTimer.id
                      minutesRow.alpha = if (on) 1f else 0.4f
                      input.isEnabled = on
                  }
                  group.setOnCheckedChangeListener { _, _ -> updateRow() }
                  group.check(
                      when (mode) {
                          Prefs.MODE_TIMER -> rTimer.id
                          Prefs.MODE_ASK -> rAsk.id
                          else -> rNone.id
                      }
                  )
                  updateRow()

                  AlertDialog.Builder(this)
                      .setTitle(item.label)
                      .setView(box)
                      .setPositiveButton("儲存") { _, _ ->
                          val newMode = when (group.checkedRadioButtonId) {
                              rTimer.id -> Prefs.MODE_TIMER
                              rAsk.id -> Prefs.MODE_ASK
                              else -> Prefs.MODE_NONE
                          }
                          val m = input.text.toString().toIntOrNull()?.coerceIn(1, 1440)
                              ?: Prefs.defaultMinutes()
                          Prefs.set(this, item.pkg, newMode, m)
                          adapter.notifyDataSetChanged()
                      }
                      .setNegativeButton("取消", null)
                      .show()
              }

              private inner class AppAdapter : BaseAdapter() {
                  override fun getCount() = apps.size
                  override fun getItem(position: Int) = apps[position]
                  override fun getItemId(position: Int) = position.toLong()

                  override fun getView(position: Int, convertView: View?, parent: ViewGroup?): View {
                      val item = apps[position]
                      val row = (convertView as? LinearLayout) ?: LinearLayout(this@MainActivity).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = android.view.Gravity.CENTER_VERTICAL
                          setPadding(0, dp(8), 0, dp(8))
                          addView(ImageView(context).apply { tag = "icon" }, LinearLayout.LayoutParams(dp(44), dp(44)))
                          addView(LinearLayout(context).apply {
                              orientation = LinearLayout.VERTICAL
                              setPadding(dp(12), 0, 0, 0)
                              addView(TextView(context).apply {
                                  tag = "name"; textSize = 16f; setTextColor(Color.parseColor("#212121"))
                              })
                              addView(TextView(context).apply {
                                  tag = "sub"; textSize = 13f
                              })
                          })
                      }
                      row.findViewWithTag<ImageView>("icon").setImageDrawable(item.icon)
                      row.findViewWithTag<TextView>("name").text = item.label
                      row.findViewWithTag<TextView>("sub").apply {
                          text = summary(item.pkg)
                          setTextColor(
                              if (Prefs.getMode(this@MainActivity, item.pkg) == Prefs.MODE_NONE)
                                  Color.GRAY else Color.parseColor("#1565C0")
                          )
                      }
                      return row
                  }
              }
          }
          APPGUARD_EOF

      - name: Build debug APK
        working-directory: appguard_project
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AppGuard-debug-apk
          path: appguard_project/app/build/outputs/apk/debug/app-debug.apk
